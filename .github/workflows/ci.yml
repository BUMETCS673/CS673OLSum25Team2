name: CI/CD - Docker Test, Lint, Audit, and Deploy MERN

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-lint-test-security:
    name: Lint, Test (Docker), Security Audit, and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 21

      - name: Distribute .env to frontend/backend
        working-directory: ./code
        run: |
          cp .env backend/.env
          cp .env frontend/.env

      - name: Validate Docker Compose
        working-directory: ./code
        run: docker compose config

      - name: Start Test Containers
        working-directory: ./code
        run: docker compose --profile test up -d --build

      - name: Backend Test Logs
        working-directory: ./code
        run: docker logs my-magical-bedtime-backend-test

      - name: Frontend Test Logs
        working-directory: ./code
        run: docker logs my-magical-bedtime-frontend-test

      - name: Stop Test Containers
        working-directory: ./code
        run: docker compose --profile test down

      - name: Upload code coverage
        uses: 5monkeys/cobertura-action@master
        with:
          path: ./code/backend/coverage/cobertura-coverage.xml
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          minimum_coverage: 75

      - name: Run npm audit (backend)
        working-directory: ./code/backend
        run: npm audit --audit-level=high

      - name: Run npm audit (frontend)
        working-directory: ./code/frontend
        run: npm audit --audit-level=high

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript

      - name: Static Analysis (CodeQL)
        uses: github/codeql-action/analyze@v2

      - name: Docker Image Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'node:latest'
          format: 'table'

  deploy-backend:
    name: Deploy Backend to Heroku
    runs-on: ubuntu-latest
    needs: [build-lint-test-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy Backend to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          git remote add heroku https://heroku:$HEROKU_API_KEY@git.heroku.com/mymagicalbedtime.git
          git subtree push --prefix code/backend heroku main

      - name: Confirm Deployment
        run: echo "✅ Deployed at: https://mymagicalbedtime-25abceb2c11f.herokuapp.com/"