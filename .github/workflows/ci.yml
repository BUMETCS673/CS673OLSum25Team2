name: CI/CD - Build, Test, Security, and Deploy MERN Stack

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-lint-test-security:
    name: Lint, Test (Docker), Security Scan, and Upload Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 21

      # Validate Docker Compose
      - name: Validate Docker Compose
        working-directory: ./code
        run: docker-compose config

      # Start test containers
      - name: Start Test Containers
        working-directory: ./code
        run: docker-compose --profile test up -d --build

      # Run Backend Tests in Docker
      - name: Run Backend Tests in Container
        working-directory: ./code
        run: docker logs my-magical-bedtime-backend-test

      # Run Frontend Tests in Docker
      - name: Run Frontend Tests in Container
        working-directory: ./code
        run: docker logs my-magical-bedtime-frontend-test

      # Stop test containers
      - name: Stop Test Containers
        working-directory: ./code
        run: docker-compose --profile test down

      # Upload coverage using Cobertura (no external setup)
      - name: Upload code coverage
        uses: 5monkeys/cobertura-action@master
        with:
          path: ./code/backend/coverage/cobertura-coverage.xml
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          minimum_coverage: 75

      # Security Scans
      - name: Security Scan (Dependabot)
        uses: actions/dependabot-action@v2

      - name: Static Analysis (CodeQL)
        uses: github/codeql-action/analyze@v2

      # Run Trivy security scan on Docker image
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'node:latest'
          format: 'table'

  deploy-backend:
    name: Deploy Backend to Heroku
    runs-on: ubuntu-latest
    needs: [build-lint-test-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy Backend to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          git remote add heroku https://heroku:$HEROKU_API_KEY@git.heroku.com/mymagicalbedtime.git
          git subtree push --prefix code/backend heroku main

      - name: Verify Backend Deployment
        run: |
          echo "✅ Backend deployment completed successfully!"
          echo "🌐 Backend API URL: https://mymagicalbedtime-25abceb2c11f.herokuapp.com/"